[package]
name = "installer-core"
description = "Manifest-driven, cross-platform application install engine (no UI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "installer_core"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true

semver = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
regex = "1"

# HTTP with pure-Rust TLS (rustls + ring). No OpenSSL at build or run time.
# Optional only so the OS-integration code can be type-checked for foreign
# targets without a C cross toolchain (`--no-default-features`).
ureq = { version = "3.1", features = ["json"], optional = true }

# Integrity
sha2 = "0.11"
hex = "0.4"

# Archives. All pure Rust, so cross-compiling to ARM/musl needs no C libraries.
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2", "deflate64", "bzip2", "lzma", "xz", "time"] }
lzma-rs = "0.3"
bzip2 = "0.6"
ruzstd = "0.9"
ar = "0.9"

# Filesystem helpers
dirs = "7"
tempfile = "3"
walkdir = "2"
which = "8"

[features]
default = ["net"]
net = ["dep:ureq"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
